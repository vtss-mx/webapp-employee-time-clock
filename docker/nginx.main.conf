# Configuración principal de Nginx ajustada para miles de usuarios concurrentes.
user  nginx;
worker_processes  auto;              # 1 proceso por núcleo
worker_rlimit_nofile 65535;          # descriptores suficientes para clientes + upstream

error_log  /var/log/nginx/error.log warn;
pid        /run/nginx.pid;

events {
    worker_connections  8192;        # por proceso (antes 1024)
    multi_accept        on;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    log_format  main  '$remote_addr [$time_local] "$request" $status $body_bytes_sent '
                      'rt=$request_time urt=$upstream_response_time trace=$upstream_http_x_request_id';
    # Buffer de logs: evita una escritura a disco por petición.
    access_log  /var/log/nginx/access.log  main buffer=64k flush=5s;

    sendfile           on;
    tcp_nopush         on;
    tcp_nodelay        on;
    server_tokens      off;
    keepalive_timeout  30s;
    keepalive_requests 1000;
    reset_timedout_connection on;
    client_body_timeout   30s;
    client_header_timeout 15s;
    send_timeout          30s;

    # Caché de descriptores de los archivos estáticos (SPA, modelos WASM).
    open_file_cache          max=10000 inactive=60s;
    open_file_cache_valid    120s;
    open_file_cache_errors   on;

    include /etc/nginx/conf.d/*.conf;
}

# Sirve la SPA y hace proxy de /api al backend (mismo origen: sin CORS ni contenido mixto).

# Detrás de ngrok u otro proxy TLS se respeta el esquema original (https).
map $http_x_forwarded_proto $forwarded_proto {
  default $http_x_forwarded_proto;
  ''      $scheme;
}

# traceId: se conserva el X-Request-ID del cliente solo si es seguro (se inserta en JSON);
# de lo contrario se genera uno en el proxy.
map $http_x_request_id $trace_id {
  default                    $request_id;
  "~^[A-Za-z0-9._-]{8,64}$"  $http_x_request_id;
}

# Conexiones persistentes hacia la API: evita abrir una conexión TCP por petición.
# - Las conexiones se reciclan cada 100 peticiones: el backend corre varios procesos que
#   comparten el socket, y una conexión persistente queda fija en un proceso; reciclarlas
#   reparte la carga entre todos (si no, uno solo atiende casi todo).
# - `resolve`: si el contenedor del backend se recrea con otra IP, Nginx la vuelve a resolver.
resolver 127.0.0.11 valid=10s ipv6=off;
upstream api_backend {
  zone api_backend 64k;
  server backend:8000 max_fails=0 resolve;
  keepalive 64;
  keepalive_requests 100;
  keepalive_timeout 4s;   # menor que --timeout-keep-alive de uvicorn (5 s)
}

# ¿Redirigir a HTTPS? Sí cuando la página llega por http:// y no es localhost (la cámara exige
# contexto seguro). Se resuelve aquí (no con varios "if" en location, que rompen try_files).
map "$forwarded_proto:$host" $needs_https {
  default 0;
  "~*^http:(?!localhost$|127\.0\.0\.1$)" 1;
}

# WebSocket: el encabezado Connection depende de si el cliente pide "upgrade".
map $http_upgrade $connection_upgrade {
  default upgrade;
  ''      close;
}

server {
  listen 80;
  listen 443 ssl;
  http2 on;
  server_name _;

  ssl_certificate     /etc/nginx/certs/server.crt;
  ssl_certificate_key /etc/nginx/certs/server.key;
  ssl_protocols       TLSv1.2 TLSv1.3;

  root /usr/share/nginx/html;
  index index.html;

  # 5 imágenes de 5 MB + margen (debe ser >= al límite del backend)
  client_max_body_size 27m;

  gzip on;
  gzip_comp_level 5;
  gzip_min_length 1024;
  gzip_proxied any;   # también comprime las respuestas JSON de la API
  gzip_vary on;
  gzip_types text/css application/javascript application/json image/svg+xml application/wasm;

  add_header X-Content-Type-Options "nosniff" always;
  add_header X-Frame-Options "DENY" always;
  add_header Referrer-Policy "no-referrer" always;
  # La app usa la cámara (rostro, QR) y la ubicación (inicio de sesión del validador, "Mi ubicación"
  # del domicilio) solo desde su propio origen; `geolocation=()` la bloquearía también para nosotros.
  add_header Permissions-Policy "camera=(self), microphone=(), geolocation=(self)" always;

  # Canal en tiempo real (validación de datos únicos): conexión persistente con upgrade.
  location /api/ws/ {
    proxy_pass http://api_backend;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $forwarded_proto;
    proxy_read_timeout 600s; # el servidor cierra por inactividad a los 300 s
    proxy_send_timeout 600s;
    proxy_buffering off;
  }

  location /api/ {
    proxy_pass http://api_backend;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $forwarded_proto;
    proxy_set_header X-Request-ID $trace_id;
    proxy_connect_timeout 5s;
    proxy_read_timeout 60s;
    # Errores generados por el proxy (no por el backend) también usan el contrato único de
    # respuesta, nunca una página HTML.
    error_page 502 503 504 = @api_unavailable;
    error_page 413 = @api_too_large;
  }

  location @api_unavailable {
    default_type application/json;
    add_header Retry-After 5 always;
    add_header X-Request-ID $trace_id always;
    add_header Cache-Control "no-store" always;
    return 503 '{"success":false,"statusCode":503,"code":"SERVICE_UNAVAILABLE","message":"El servicio se está reiniciando. Intenta nuevamente en unos segundos.","data":null,"errors":[{"code":"SERVICE_UNAVAILABLE","message":"El servicio se está reiniciando. Intenta nuevamente en unos segundos.","field":null,"details":null}],"traceId":"$trace_id","timestamp":"$time_iso8601"}';
  }

  location @api_too_large {
    default_type application/json;
    add_header X-Request-ID $trace_id always;
    add_header Cache-Control "no-store" always;
    return 413 '{"success":false,"statusCode":413,"code":"PAYLOAD_TOO_LARGE","message":"La solicitud excede el tamaño máximo permitido.","data":null,"errors":[{"code":"PAYLOAD_TOO_LARGE","message":"La solicitud excede el tamaño máximo permitido.","field":null,"details":null}],"traceId":"$trace_id","timestamp":"$time_iso8601"}';
  }

  # Swagger del backend también accesible desde el frontend (opcional)
  location ~ ^/(docs|redoc|openapi.json)$ {
    proxy_pass http://backend:8000;
    proxy_set_header Host $host;
  }

  # Nota: no usar add_header dentro de location (anularía las cabeceras de seguridad heredadas).
  location /assets/ {
    expires 1y;
  }

  location /mediapipe/ {
    expires 30d;
    types {
      application/wasm wasm;
      application/javascript js;
      application/octet-stream tflite;
    }
  }

  # SPA: cualquier ruta del cliente devuelve index.html
  location / {
    # La cámara solo funciona en HTTPS (o localhost). Quien abre la app por http://<IP> desde otra
    # computadora o un teléfono se redirige a https://<IP>:8443. ngrok y otros proxies TLS ya llegan
    # con X-Forwarded-Proto: https y no se redirigen.
    if ($needs_https) {
      return 301 https://$host:8443$request_uri;
    }
    try_files $uri /index.html;
    expires -1;
  }
}

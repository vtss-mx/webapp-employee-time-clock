# Cabeceras hacia la API, incluidas en CADA location que hace proxy (Nginx solo hereda proxy_set_header de
# un nivel superior si el location no define ninguna propia; las de WebSocket y keepalive sí definen).
#
# IP real del cliente: la que ve ESTE Nginx (o la que dice un proxy de confianza, NGINX_TRUSTED_PROXIES:
# CDN, balanceador, ngrok). Se REEMPLAZA X-Forwarded-For en lugar de agregarle: un cliente no puede
# inventar su IP y el backend solo confía en este gateway (FORWARDED_ALLOW_IPS).
proxy_set_header Host $host;
proxy_set_header X-Real-IP $remote_addr;
proxy_set_header X-Forwarded-For $remote_addr;
proxy_set_header X-Forwarded-Proto $forwarded_proto;
proxy_set_header X-Request-ID $trace_id;
